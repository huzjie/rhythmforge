apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rhythmforge
  namespace: rhythmforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rhythmforge
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
