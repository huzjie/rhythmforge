name: Benchmark

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run benchmark
        run: rhythmforge bench
