name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Compile
        run: python -m compileall rhythmforge examples tests
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Doctor
        run: rhythmforge doctor
      - name: Demo
        run: rhythmforge demo
