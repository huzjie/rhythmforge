[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythmforge"
version = "1.0.0"
description = "Realtime Decision Engine & Lookahead Safety Planner (NeoHorse-Jev-4B inspired)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "rhythmforge contributors"}]
keywords = ["decision", "realtime", "lookahead", "planning", "reinforcement-learning", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/huzjie/rhythmforge"

[project.scripts]
rhythmforge = "rhythmforge.cli.main:main"

[tool.setuptools.packages.find]
include = ["rhythmforge*"]
